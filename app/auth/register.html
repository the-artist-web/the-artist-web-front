    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Custom Js Link -->
    <script type="module" src="../../src/js/theme.js"></script>
    <script type="module" src="../../src/js/app.js"></script>

</head>

<body>

    <!-- Overlay & Progress Bar -->
    <div class="overlay" data-overlay></div>
    <div class="progress-bar" data-progress-bar></div>

    <!-- Start Loading -->
    <div class="start-loading" data-start-loading>
        <div class="logo extra-large">
            <img src="../../src/assets/images/logo.svg" alt="The Artist Web" class="img-logo img-cover" />
        </div>
    </div>

    <!-- Auth -->
    <article class="auth">

        <form action="#" method="post" class="form-card container container-xs">
            <a href="../../app/index.html" class="logo large">
                <img src="../../src/assets/images/logo.svg" alt="The Artist Web" loading="lazy" class="img-logo img-cover" />
            </a>

            <div class="wrapper-block">
                <h3 class="text-headline-small">Get started on The Artist Web</h3>

                <p class="text-body-medium text-on-background-variant">Create your account to explore trending digital themes, publish your own products, and connect with a thriving community of creators.</p>
            </div>

            <div class="grid-2-base">
                <div class="form-group">
                    <label for="first_name">First Name</label>

                    <div class="input-wrapper outline large">
                        <input type="text" placeholder="Enter your first name" name="name" value="" id="first_name" class="text-body-large" />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-body-medium text-error"></p> -->
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-wrapper outline large">
                        <input type="text" placeholder="Enter your username" name="username" value="" id="username" class="text-body-large" />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-body-medium text-error"></p> -->
                </div>
            </div>

            <div class="form-group">
                <label for="date_of_birth">Date of birth</label>

                <div class="grid-3-base">
                    <div class="wrapper-block">
                        <div class="select-wrapper outline large">
                            <select name="day" id="date_of_birth" class="text-body-large">
                                <option value="" selected>Day</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                                <option value="17">17</option>
                                <option value="18">18</option>
                                <option value="19">19</option>
                                <option value="20">20</option>
                                <option value="21">21</option>
                                <option value="22">22</option>
                                <option value="23">23</option>
                                <option value="24">24</option>
                                <option value="25">25</option>
                                <option value="26">26</option>
                                <option value="27">27</option>
                                <option value="28">28</option>
                                <option value="29">29</option>
                                <option value="30">30</option>
                                <option value="31">31</option>
                            </select>

                            <div class="icon-btn large arrow-select">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                            </div>

                            <div class="state-layer"></div>
                        </div>

                        <!-- <p class="text-body-medium text-error"></p> -->
                    </div>

                    <div class="wrapper-block">
                        <div class="select-wrapper outline large">
                            <select name="month" class="text-body-large">
                                <option value="" selected>Month</option>
                                    <option value="1">January</option>
                                    <option value="2">February</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="6">June</option>
                                    <option value="7">July</option>
                                    <option value="8">August</option>
                                    <option value="9">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                            </select>

                            <div class="icon-btn large arrow-select">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                            </div>

                            <div class="state-layer"></div>
                        </div>

                        <!-- <p class="text-body-medium text-error"></p> -->
                    </div>

                    <div class="wrapper-block">
                        <div class="select-wrapper outline large">
                            <select name="year" class="text-body-large">
                                <option value="" selected>Year</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                                <option value="2020">2020</option>
                            </select>

                            <div class="icon-btn large arrow-select">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                            </div>

                            <div class="state-layer"></div>
                        </div>

                        <!-- <p class="text-body-medium text-error"></p> -->
                    </div>
                </div>

            </div>

            <div class="form-group">
                <label for="gender">Gender</label>

                <div class="select-wrapper outline large">
                    <select name="gender" id="gender" class="text-body-large">
                        <option value="" selected>Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="prefer_not_to_say">Prefer not to disclose</option>
                    </select>

                    <div class="icon-btn large arrow-select">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                    </div>

                    <div class="state-layer"></div>
                </div>

                <!-- <p class="text-body-medium text-error"></p> -->
            </div>

            <div class="form-group">
                <label for="email_address">Email Address</label>

                <div class="input-wrapper outline large">
                    <input type="email" placeholder="Enter your email address" name="email" value="" id="email_address" class="text-body-large" />

                    <div class="state-layer"></div>
                </div>

                <!-- <p class="text-body-medium text-error"></p> -->
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper outline large">
                    <input type="password" placeholder="Enter your password" name="email" value="" id="password" class="text-body-large" />

                    <div class="state-layer"></div>
                </div>

                <!-- <p class="text-body-medium text-error"></p> -->
            </div>

            <div class="form-check">
                <input type="checkbox" name="" id="i_agree" class="checkbox-btn" />

                <label for="i_agree" class="text-body-large">I agree with <a href="../../web/legal/terms-of-services.html" target="_blank" class="btn-link">terms of use</a> and <a href="../../web/legal/privacy-policy.html" target="_blank" class="btn-link">Privacy Policy</a></label>
            </div>

            <div class="wrapper-block">
                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">Create new account</p>

                    <div class="state-layer"></div>
                </button>

                <a href="../../app/auth/login.html" class="btn text medium w-full">
                    <p class="text-body-large">I already have an account</p>

                    <div class="state-layer"></div>
                </a>
            </div>
        </form>

        <footer class="footer">

            <div class="container container-xl">

                <div class="wrapper">
                    <!-- start -->
                </div>

                <div class="wrapper">
                    <div class="form-group">
                        <div class="select-wrapper text extra-small">
                            <select name="languages" class="text-body-medium">
                                <option value="english" selected>English</option>
                                <option value="arabic">Arabic</option>
                            </select>

                            <div class="icon-btn extra-small arrow-select">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                            </div>

                            <div class="state-layer"></div>
                        </div>
                    </div>

                    <p class="text-body-medium text-on-background-variant">© 2026 The Artist Web, Inc.</p>
                </div>

            </div>

        </footer>

    </article>

</body>

</html>
