        <div class="auth-body">

            <div class="logo large">
                <img src="../src/assets/images/logo-dark.svg" alt="The Artist Web" class="img-logo theme-light img-cover" />

                <img src="../src/assets/images/logo-light.svg" alt="The Artist Web" class="img-logo theme-dark img-cover" />
            </div>

            <form action="" method="POST" class="form-card">

                <div class="wrapper-block text-center">
                    <h3 class="text-headline-small">Become an creator</h3>

                    <p class="text-body-large text-on-background-variant">Creators can join the Artist Web Network by invitation or by applying using the form below.</p>
                </div>

                <div class="form-group">
                    <label for="full_name">Full Name <span class="text-primary text-body-medium">*</span></label>

                    <div class="input-wrapper outline medium">
                        <input type="text" placeholder="Enter your full name" name="" value="" id="full_name" class="text-body-large" />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="text-primary text-body-medium">*</span></label>

                    <div class="input-wrapper outline medium">
                        <input type="email" placeholder="Enter your email address" name="" value="" id="email" class="text-body-large" />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="portfolio">Link to portfolio or product example <span class="text-primary text-body-medium">*</span></label>

                    <div class="input-wrapper outline medium">
                        <input type="url" placeholder="https://yourportfolio.com" name="" value="" id="portfolio" class="text-body-large" />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="additional_information">Additional information</label>

                    <div class="textarea-wrapper outline medium">
                        <textarea placeholder="Write a short message (optional)..." name="" id="additional_information" class="text-body-large"></textarea>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">Apply</p>

                    <div class="state-layer"></div>
                </button>
            </form>

            <div class="wrapper-between">
                <p class="text-body-medium text-on-background-variant">© 2026 The Artist Web, Inc.</p>

                <form action="#" method="POST" class="form-group">
    
                    <div class="select-wrapper text extra-small">
                        <select name="languages" class="text-body-medium">
