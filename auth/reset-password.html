    <body 
        id="up"
        lang="en"
    >
        <!-- Start Load -->
        <div class="start-load" data-start-load>
            <img
                src="../src/assets/images/logo-dark.png"
                alt="The Artist Web"
                loading="lazy"
                class="img-load img-cover"
            />

            <h2 class="text-capitalize text-black">The Artist Web</h2>
        </div>

        <main class="main">
            <div class="auth-wrapper">
                <div class="wrapper">
                    <img
                        src="https://cdnb.artstation.com/p/assets/images/images/058/920/379/original/serena-turtle-untitled-artwork-2.gif?1675250214"
                        alt="The Artist Web"
                        loading="lazy"
                        class="img-auth img-cover"
                    />
                </div>

                <div class="wrapper wrapper-2 container container-xl">
                    <!-- Header -->
                    <header>
                        <a 
                            href="../index.html" 
                            class="logo"
                            data-bs-toggle="tooltip"
                            data-bs-placement="bottom"
                            data-bs-title="The Artist Web"
                        >
                            <img
                                src="../src/assets/images/logo-dark.png"
                                alt="The Artist Web"
                                loading="lazy"
                                class="logo-dark img-cover"
                            />

                            <img
                                src="../src/assets/images/logo-light.png"
                                alt="The Artist Web"
                                loading="lazy"
                                class="logo-light img-cover"
                            />

                            <div class="state-layer"></div>
                        </a>

                        <div class="d-flex align-items-center gap-2">
                            <button
                                type="button"
                                class="icon-btn large"
                                data-bs-toggle="tooltip"
                                data-bs-placement="bottom"
                                data-bs-title="Toggle Theme"
                                data-toggle-theme
                            >
                                <span class="light">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-sun"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg>
                                </span>

                                <span class="dark">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-moon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg>
                                </span>
                                
                                <div class="state-layer"></div>
                            </button>

                            <div class="dropdown dropdown-small">
                                <button 
                                    type="button" 
                                    class="icon-btn large" 
                                    data-bs-toggle="dropdown"
                                >
                                    <span
                                        data-bs-toggle="tooltip"
                                        data-bs-placement="bottom"
                                        data-bs-title="Languages"
                                    >
                                        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-world"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M3.6 9h16.8" /><path d="M3.6 15h16.8" /><path d="M11.5 3a17 17 0 0 0 0 18" /><path d="M12.5 3a17 17 0 0 1 0 18" /></svg>
                                    </span>

                                    <div class="state-layer"></div>
                                </button>

                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a 
                                            href="#"
                                            class="dropdown-item" 
                                            data-languages="en"
                                        >
                                            English

                                            <div class="state-layer"></div>
                                        </a>
                                    </li>

                                    <li>
                                        <a 
                                            href="#"
                                            class="dropdown-item" 
                                            data-languages="ar"
                                        >
                                            Arabic

                                            <div class="state-layer"></div>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </header>

                    <div
                        class="d-grid gap-5 overflow-y-auto custom-scrollbar"
                        style="grid-template-rows: 1fr max-content;"
                    >
                        <!-- Box Form -->
                        <div class="d-flex align-items-center justify-content-center">
                            <form
                                class="d-flex flex-column w-100"
                                style="
                                    max-width: 386px; 
                                    gap: 20px;
                                "
                                data-reset-password
                            >
                                <div class="d-flex flex-column text-center gap-2">
                                    <h2>Reset password</h2>

                                    <p class="text-third-color">Must be at least 8 characters</p>
                                </div>

                                <div class="form-box">
                                    <label 
                                        for="password" 
                                        class="form-label"
                                    >password</label>

                                    <div class="input-wrapper" data-passwords>
                                        <input
                                            type="password"
                                            placeholder="Enter your password"
                                            id="password"
                                            name="password"
                                            value=""
                                            class="form-control"
                                            data-field="password"
                                        />

                                        <button
                                            type="button"
                                            class="icon-btn small"
                                            data-toggle-password
                                        ></button>

                                        <div class="state-layer"></div>
                                    </div>

                                    <div class="validation"></div>
                                </div>

                                <div class="form-box">
                                    <label 
                                        for="confirm_password" 
                                        class="form-label"
                                    >confirm password</label>

                                    <div class="input-wrapper" data-passwords>
                                        <input
                                            type="password"
                                            placeholder="Enter your confirm password"
                                            id="confirm_password"
                                            name="password_confirmation"
                                            value=""
                                            class="form-control"
                                            data-field="confirmPassword"
                                        />

                                        <button
                                            type="button"
                                            class="icon-btn small"
                                            data-toggle-password
                                        ></button>

                                        <div class="state-layer"></div>
                                    </div>

                                    <div class="validation"></div>
                                </div>

                                <button
                                    type="submit"
                                    class="btn btn-light"
                                >
                                    Reset password

                                    <div class="state-layer"></div>
                                </button>

                                <a 
                                    href="./login.html"
                                    class="d-flex align-items-center justify-content-center gap-3"
                                >
                                    <span class="dir">
                                        <svg  xmlns="http://www.w3.org/2000/svg"  width="18"  height="18"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>
                                    </span>

                                    <p>Back to login</p>
                                </a>
                            </form>
                        </div>

                        <!-- Footer -->
                        <footer>
                            <p 
                                class="text-third-color" 
                                data-copyright="The Artist Web"
                                style="letter-spacing: 0;"
                            ></p>
                        </footer>
                    </div>
                </div>
            </div>
        </main>

        <!-- custom bootstrap bundle min js link -->
        <script src="../src/assets/bootstrap/bootstrap.bundle.min.js"></script>
        <!-- custom aos js link -->
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script>
            AOS.init({
                duration: 1000,
                once: true,
                offset: 180
            });
        </script>
    </body>
</html>
